<div class="modal-overlay" *ngIf="isVisible" (click)="closeModal()">
  <div class="modal-content" (click)="$event.stopPropagation()">
    <div class="modal-header">
      <h2>{{ title }}</h2>
      <button class="close-btn" (click)="closeModal()">&times;</button>
    </div>

    <form [formGroup]="userForm" (ngSubmit)="saveUser()">
      <div class="form-group">
        <label for="username">Username *</label>
        <input
          type="text"
          id="username"
          formControlName="username"
          [placeholder]="isEditMode ? 'Leave blank to keep current' : 'Enter username'"
        />


        <div class="error" *ngIf="userForm.get('username')?.invalid && userForm.get('username')?.touched">
          Username is required
        </div>
      </div>

      <div class="form-group">
        <label>Email</label>
        <input
          type="email"
          formControlName="email"
          class="form-control"
          [readonly]="isEditMode"
          [class.disabled-look]="isEditMode">
        <small *ngIf="isEditMode" class="info-text">Email cannot be changed.</small>
      </div>

      <div class="form-group">
        <label for="password">Password {{ isEditMode ? '(leave blank to keep current)' : '*' }}</label>
        <input
          type="password"
          id="password"
          formControlName="password"
          placeholder="Enter password"
        />
        <div class="error" *ngIf="userForm.get('password')?.invalid && userForm.get('password')?.touched">
          Password is required
        </div>
      </div>

      <div class="form-group">
        <label for="role">Role *</label>
        <select id="role" formControlName="role">
          <option value="STUDENT">Student</option>
          <option value="ADMIN">Admin</option>
        </select>
      </div>

      <div class="modal-actions">
        <button type="button" class="btn-secondary" (click)="closeModal()">Cancel</button>
        <button type="submit" class="btn-primary" [disabled]="userForm.invalid">
          {{ submitButtonText }}
        </button>
      </div>
    </form>
  </div>
</div>
